<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Бібліотека інтерактивних уроків онлайн-школи КВАНТ: тема, предмет і клас для кожного уроку.">
<meta name="color-scheme" content="light dark">
<meta property="og:type" content="website">
<meta property="og:title" content="Уроки КВАНТ">
<meta property="og:description" content="Бібліотека інтерактивних уроків онлайн-школи КВАНТ.">
<meta property="og:locale" content="uk_UA">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Crect width=%27100%27 height=%27100%27 rx=%2722%27 fill=%27%236741FF%27/%3E%3Ctext y=%27.9em%27 x=%27.5em%27 text-anchor=%27middle%27 font-size=%2762%27 fill=%27white%27 font-family=%27Georgia,serif%27%3EК%3C/text%3E%3C/svg%3E">
<title>Уроки КВАНТ — бібліотека</title>

<style>
:root{
  --ground:#F4F3FA; --surface:#FFFFFF; --surface-2:#FAF9FE; --surface-3:#F1EFFB;
  --line:#E5E2F2; --line-strong:#D3CEEA;
  --ink:#191730; --ink-2:#5C5880; --ink-3:#8A86A8;
  --accent:#6741FF; --accent-ink:#FFFFFF; --accent-soft:#EDE8FF; --accent-line:#CFC2FF;
  --shadow:0 1px 2px rgba(25,23,48,.05), 0 12px 32px -18px rgba(48,32,120,.28);
  --font-display:'Cambria','Georgia','Times New Roman',serif;
  --font-ui:'Segoe UI Variable Text','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#100E1A; --surface:#191728; --surface-2:#1F1D31; --surface-3:#242138;
    --line:#2C2942; --line-strong:#3A3656;
    --ink:#ECEAF8; --ink-2:#A29DC2; --ink-3:#7C779C;
    --accent:#9B82FF; --accent-ink:#14102A; --accent-soft:#272044; --accent-line:#463A78;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  --ground:#100E1A; --surface:#191728; --surface-2:#1F1D31; --surface-3:#242138;
  --line:#2C2942; --line-strong:#3A3656;
  --ink:#ECEAF8; --ink-2:#A29DC2; --ink-3:#7C779C;
  --accent:#9B82FF; --accent-ink:#14102A; --accent-soft:#272044; --accent-line:#463A78;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -20px rgba(0,0,0,.7);
}
:root[data-theme="light"]{
  --ground:#F4F3FA; --surface:#FFFFFF; --surface-2:#FAF9FE; --surface-3:#F1EFFB;
  --line:#E5E2F2; --line-strong:#D3CEEA;
  --ink:#191730; --ink-2:#5C5880; --ink-3:#8A86A8;
  --accent:#6741FF; --accent-ink:#FFFFFF; --accent-soft:#EDE8FF; --accent-line:#CFC2FF;
  --shadow:0 1px 2px rgba(25,23,48,.05), 0 12px 32px -18px rgba(48,32,120,.28);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:var(--font-ui); font-size:16px; line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
h1,h2{font-family:var(--font-display); font-weight:600; text-wrap:balance; margin:0}
p{margin:0}
button{font:inherit; color:inherit; cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent); outline-offset:3px; border-radius:8px}

.top{
  display:flex; align-items:center; gap:16px; flex-wrap:wrap;
  padding:14px clamp(14px,3vw,28px);
  border-bottom:1px solid var(--line); background:var(--surface);
}
.brand{display:flex; align-items:center; gap:10px; text-decoration:none}
.brand .mark{
  width:34px; height:34px; border-radius:10px; flex:none;
  background:linear-gradient(140deg,var(--accent),#B78CFF);
  display:grid; place-items:center; color:#fff; font-weight:700; font-size:15px;
  font-family:var(--font-display);
}
.brand b{font-family:var(--font-display); font-size:18px; letter-spacing:.06em; display:block; line-height:1.1}
.brand small{font-size:11px; color:var(--ink-3); letter-spacing:.14em; text-transform:uppercase}
.themebtn{
  margin-left:auto; border:1px solid var(--line-strong); background:var(--surface-2); color:var(--ink-2);
  width:34px; height:32px; border-radius:10px; display:grid; place-items:center;
  font-size:15px; line-height:1; transition:.16s ease;
}
.themebtn:hover{border-color:var(--accent-line); color:var(--accent)}

.wrap{max-width:920px; margin:0 auto; padding:clamp(28px,5vw,52px) clamp(14px,3vw,28px) 64px}
.head{display:flex; flex-direction:column; gap:11px; margin-bottom:30px}
.head .eyebrow{font-size:11.5px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent)}
.head h1{font-size:clamp(30px,5vw,42px); line-height:1.14; letter-spacing:-.015em}
.head p{font-size:18px; color:var(--ink-2); max-width:62ch}

.bar{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  padding-bottom:14px; border-bottom:1px solid var(--line);
}
.bar .lbl{font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3); margin-right:3px}
.bar .count{font-size:13.5px; color:var(--ink-3); margin-left:auto; font-variant-numeric:tabular-nums}
.chip{
  border:1px solid var(--line-strong); background:var(--surface); color:var(--ink-2);
  padding:6px 14px; border-radius:999px; font-size:14px; transition:.16s ease;
}
.chip:hover{border-color:var(--accent-line); color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent); border-color:transparent; color:var(--accent-ink); font-weight:500}

.list{list-style:none; margin:18px 0 0; padding:0; display:flex; flex-direction:column; gap:12px}
.row{
  display:block; text-decoration:none; background:var(--surface);
  border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow);
  padding:20px 22px; transition:border-color .18s ease, transform .18s ease;
}
.row:hover{border-color:var(--accent-line); transform:translateY(-2px)}
.row .tags{display:flex; align-items:center; gap:7px; flex-wrap:wrap; margin-bottom:9px}
.pill{
  font-size:12px; letter-spacing:.03em; padding:4px 11px; border-radius:999px;
  border:1px solid var(--line-strong); color:var(--ink-2); background:var(--surface-2); white-space:nowrap;
}
.pill.subject{background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); font-weight:500}
.pill.grade{background:var(--surface-3)}
.row h2{font-size:21px; line-height:1.28; letter-spacing:-.005em}
.row .desc{margin-top:7px; color:var(--ink-2); font-size:15.5px; max-width:64ch}
.row .rfoot{
  display:flex; align-items:center; gap:11px; flex-wrap:wrap;
  margin-top:14px; padding-top:13px; border-top:1px solid var(--line);
  font-size:13.5px; color:var(--ink-3);
}
.row .go{margin-left:auto; color:var(--accent); font-weight:500}
.dotsep{width:3px; height:3px; border-radius:50%; background:currentColor; opacity:.55; flex:none}
.empty{
  border:1px dashed var(--line-strong); border-radius:16px; padding:34px 22px;
  text-align:center; color:var(--ink-3); font-size:15px;
}
.foot-note{
  margin-top:42px; padding-top:20px; border-top:1px solid var(--line);
  color:var(--ink-3); font-size:13.5px; display:flex; gap:12px; flex-wrap:wrap;
  justify-content:space-between; align-items:center;
}
@media (prefers-reduced-motion:reduce){ *{transition:none !important} .row:hover{transform:none} }
</style>
</head>
<body>

<header class="top">
  <a class="brand" href="./">
    <span class="mark">К</span>
    <span><b>КВАНТ</b><small>онлайн-школа</small></span>
  </a>
  <button class="themebtn" id="theme" type="button" aria-label="Перемкнути тему" title="Світла / темна тема">◐</button>
</header>

<div class="wrap">
  <div class="head">
    <span class="eyebrow">Бібліотека</span>
    <h1>Опубліковані уроки</h1>
    <p>Кожен урок — самостійна сторінка з поясненням, розібраними прикладами, практикою й тестом. Відкривається без реєстрації, працює на телефоні.</p>
  </div>

  <div class="bar" id="bar">
    <span class="lbl" id="barlbl">Предмет</span>
    <span id="subjects" style="display:contents"></span>
    <span class="count" id="count"></span>
  </div>

  <ul class="list" id="list"></ul>

  <div class="foot-note">
    <span>Уроки для платформи «КВАНТ» · граф знань як джерело істини</span>
    <span>Оновлено 4 серпня 2026</span>
  </div>
</div>

<script>
(function(){
  'use strict';

  /* Перелік уроків. Додати урок = один запис тут + тека з index.html поруч. */
  var LESSONS = [
    {
      title: 'Квадратне рівняння: розв’язування через дискримінант',
      subject: 'Алгебра',
      grade: '8 клас',
      href: 'dyskryminant/',
      description: 'Звідки береться формула дискримінанта, що означають три випадки знака D і як не втрачати мінуси в коефіцієнтах. З графіками парабол, покроковим розбором і тестом із поясненнями.',
      stages: 14,
      minutes: 25,
      updated: '4 серпня 2026'
    }
  ];

  var list = document.getElementById('list');
  var subjectsBox = document.getElementById('subjects');
  var countEl = document.getElementById('count');
  var active = 'all';

  var subjects = [];
  LESSONS.forEach(function(l){ if (subjects.indexOf(l.subject) === -1) subjects.push(l.subject); });

  /* Фільтр показуємо лише тоді, коли є з чого вибирати. */
  if (subjects.length > 1){
    addChip('Усі', 'all');
    subjects.forEach(function(s){ addChip(s, s); });
  } else {
    document.getElementById('barlbl').style.display = 'none';
  }

  function addChip(label, value){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = label;
    b.setAttribute('aria-pressed', value === active ? 'true' : 'false');
    b.addEventListener('click', function(){
      active = value;
      Array.prototype.forEach.call(subjectsBox.querySelectorAll('.chip'), function(c){
        c.setAttribute('aria-pressed', c === b ? 'true' : 'false');
      });
      render();
    });
    subjectsBox.appendChild(b);
  }

  function plural(n, one, few, many){
    var n10 = n % 10, n100 = n % 100;
    if (n10 === 1 && n100 !== 11) return one;
    if (n10 >= 2 && n10 <= 4 && (n100 < 10 || n100 >= 20)) return few;
    return many;
  }

  function render(){
    var items = LESSONS.filter(function(l){ return active === 'all' || l.subject === active; });
    list.innerHTML = '';
    countEl.textContent = items.length + ' ' + plural(items.length, 'урок', 'уроки', 'уроків');

    if (!items.length){
      var e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'За цим предметом уроків поки немає.';
      list.appendChild(e);
      return;
    }

    items.forEach(function(l){
      var li = document.createElement('li');
      var a = document.createElement('a');
      a.className = 'row';
      a.href = l.href;
      a.innerHTML =
        '<div class="tags"><span class="pill subject"></span><span class="pill grade"></span></div>' +
        '<h2></h2><p class="desc"></p>' +
        '<div class="rfoot">' +
          '<span class="st"></span><span class="dotsep"></span>' +
          '<span class="mn"></span><span class="dotsep"></span>' +
          '<span class="up"></span><span class="go">Відкрити урок →</span>' +
        '</div>';
      a.querySelector('.subject').textContent = l.subject;
      a.querySelector('.grade').textContent = l.grade;
      a.querySelector('h2').textContent = l.title;
      a.querySelector('.desc').textContent = l.description;
      a.querySelector('.st').textContent = l.stages + ' ' + plural(l.stages, 'етап', 'етапи', 'етапів');
      a.querySelector('.mn').textContent = '≈ ' + l.minutes + ' хв';
      a.querySelector('.up').textContent = 'оновлено ' + l.updated;
      li.appendChild(a);
      list.appendChild(li);
    });
  }

  render();

  var root = document.documentElement, btn = document.getElementById('theme'), KEY = 'kvant-theme';
  try { var saved = localStorage.getItem(KEY); if (saved) root.setAttribute('data-theme', saved); } catch (e) {}
  btn.addEventListener('click', function(){
    var isDark = root.getAttribute('data-theme') === 'dark' ||
      (!root.getAttribute('data-theme') && window.matchMedia('(prefers-color-scheme: dark)').matches);
    var next = isDark ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem(KEY, next); } catch (e) {}
  });
})();
</script>
</body>
</html>
